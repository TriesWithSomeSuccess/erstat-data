name: Monthly snapshot

# Pulls the monthly snapshot and commits it. It does NOT publish to Zenodo;
# Hetzner does that, from publish-zenodo.sh in the repo root, at 10:30 UTC on the
# 1st, where the data is generated anyway.
#
# An earlier version of this comment blamed the publish failures on these shared
# runner IPs, because Zenodo WAF says "unusual traffic from your network". That
# was wrong. The WAF refuses two User-Agents, a missing one and the literal
# string "node", and Node's built-in fetch sends "node". Runner IPs were never
# the problem, so do not move the publish back here expecting that to fix
# anything -- the header in scripts/zenodo.mjs is what matters.

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull snapshot
        env:
          ERSTAT_API_KEY: ${{ secrets.ERSTAT_API_KEY }}
        run: node scripts/snapshot.mjs
      - name: Commit
        run: |
          git config user.name "Jason Turnbull"
          git config user.email "jasonturnbull25@gmail.com"
          git add data latest
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push
